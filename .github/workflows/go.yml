# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.x'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3.1.1
      with:
        versionSpec: '6.0.x'

    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v3.1.1
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Output GitVersion variables
      run: |
        echo "Version: ${{ steps.gitversion.outputs.semVer }}"
        echo "Full SemVer: ${{ steps.gitversion.outputs.fullSemVer }}"

    - name: Tag and Push Version
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GIT_TAG: ${{ steps.gitversion.outputs.fullSemVer }}
        GITHUB_TOKEN: ${{ secrets.GO_BUILD_TOKEN }}
      run: |
        git config --local user.name "GitHub Actions"
        git config --local user.email "actions@github.com"
        git tag -a "v$GIT_TAG" -m "Release $GIT_TAG"
        git push origin "v$GIT_TAG"

